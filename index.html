<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title><title>Zomato Food Menu - Version 2</title>
</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f8f8f8;
            margin: 0;
        }

        header {
            background: #e23744;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 24px;
        }

        .container {
            width: 90%;
            margin: 20px auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 5px gray;
            overflow: hidden;
        }

        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }

        .card-body {
            padding: 12px;
        }

        .price {
            color: green;
            font-weight: bold;
        }

        button {
            background: #e23744;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #c92c38;
        }
    </style>
</head>

<body>

<header>
    🍔 <header>
    🍔 Zomato Food Menu - Version 2
</header>

</header>

<div class="container">

    <div class="card">
        <img src="https://images.unsplash.com/photo-1606755962773-d324e0a13086">
        <div class="card-body">
            <h3>Burger</h3>
            <p>Cheese Burger</p>
            <div class="price">₹150</div>
            <button>Order</button>
        </div>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1601924582975-7aaecf1d84c4">
        <div class="card-body">
            <h3>Pizza</h3>
            <p>Loaded Pizza</p>
            <div class="price">₹250</div>
            <button>Order</button>
        </div>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1589302168068-964664d93dc0">
        <div class="card-body">
            <h3>Biryani</h3>
            <p>Chicken Biryani</p>
            <div class="price">₹300</div>
            <button>Order</button>
        </div>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1555939594-58d7cb561ad1">
        <div class="card-body">
            <h3>Noodles</h3>
            <p>Veg Noodles</p>
            <div class="price">₹120</div>
            <button>Order</button>
        </div>
    </div>

</div>

</body>
</html>
